<!-- ==========================================================================
     ASSIGNMENT-SUBMISSIONS.HTML - StudyPod v2.1
     Purpose: Assignment Submissions page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Submissions | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/assignments.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <!-- PAGE HEADER: Title, description and primary actions -->
        <div class="page-head">
          <div><a href="assignments.html" style="font-size:12px;color:var(--text-muted)">← Assignments</a>
            <h1 id="asg-title" style="margin-top:6px">Submissions</h1>
            <p id="asg-token" style="font-size:12px;color:var(--text-muted)"></p>
            <p id="asg-course" style="font-size:13px;color:var(--text-secondary)"></p>
          </div>
        </div>
        <!-- CARD: Main content card -->
        <div class="card card-pad-lg">
          <!-- TABLE WRAPPER: Responsive table container -->
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Submitted</th>
                  <th>Score</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="subs-body"></tbody>
            </table>
          </div>
        </div>
        <div id="review-modal" class="modal-overlay">
          <div class="modal">
            <div class="modal-head">
              <h3>Review Submission</h3><button class="drawer-close" onclick="closeModal('review-modal')"><svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
                  <line x1="18" y1="6" x2="6" y2="18" />
                  <line x1="6" y1="6" x2="18" y2="18" />
                </svg></button>
            </div>
            <div class="modal-body" id="review-body"></div>
          </div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/assignment-submissions.js"></script>

</body>

</html>
