<!-- ==========================================================================
     CONFERENCES.HTML - StudyPod v2.1
     Purpose: Conferences page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conferences | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/conferences.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <!-- PAGE HEADER: Title, description and primary actions -->
        <div class="page-head">
          <div>
            <h1>Conferences</h1>
            <p>Create, schedule and manage your conferences.</p>
          </div>
          <a href="conference-form.html" class="btn-primary">+ Create Conference</a>
        </div>
        <div class="page-grid" id="conf-stats">
          <div class="metric-card"><span>Total Conferences</span><strong id="total-confs">0</strong></div>
          <div class="metric-card"><span>Published</span><strong id="published-confs">0</strong></div>
          <div class="metric-card"><span>Drafts</span><strong id="draft-confs">0</strong></div>
          <div class="metric-card"><span>Completed</span><strong id="completed-confs">0</strong></div>
        </div>
        <!-- CARD: Main content card -->
        <div class="card card-pad-lg">
          <div class="toolbar" id="conf-toolbar">
            <input id="conf-search" class="search-input"
              placeholder="Search conferences by name, workshop, location...">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <select id="filter-status" class="select-input">
                <option value="all">All Status</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
                <option value="completed">Completed</option>
              </select>
              <select id="filter-workshop" class="select-input">
                <option value="all">All Workshops</option>
              </select>
              <select id="filter-delivery" class="select-input">
                <option value="all">All Delivery</option>
                <option value="Virtual">Virtual</option>
                <option value="On-Premise">On-Premise</option>
              </select>
            </div>
          </div>
          <div id="conf-grid" class="conf-grid" style="margin-top:16px"></div>
          <div id="empty-confs" class="empty-state" style="display:none;margin-top:16px">
            <div class="empty-icon"><span class="animated-icon anim-bounce-subtle" style="width:20px;height:20px"><svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                </svg></span></div>
            <div class="empty-title">No conferences found</div>
            <div class="empty-sub">Create a conference to start managing registrations.</div><a
              href="conference-form.html" class="btn-primary" style="margin-top:12px">Create Conference</a>
          </div>
          <div id="no-conf-results" class="empty-state" style="display:none;margin-top:16px">
            <div class="empty-title">No matching conferences</div>
            <div class="empty-sub">Try adjusting search or filters</div>
          </div>
        </div>
        <div class="card card-pad-lg" id="past-card">
          <div class="card-head">
            <div class="card-title">Past Conferences</div>
          </div>
          <div id="past-list" class="past-list" style="margin-top:12px"></div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/conferences.js"></script>

</body>

</html>
