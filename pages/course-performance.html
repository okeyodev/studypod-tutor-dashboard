<!-- ==========================================================================
     COURSE-PERFORMANCE.HTML - StudyPod v2.1
     Purpose: Course Performance page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Course Performance | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/courses.css">
  <link rel="stylesheet" href="../css/tutor-pages.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <!-- PAGE HEADER: Title, description and primary actions -->
        <div class="page-head">
          <div><a href="courses.html" style="font-size:12px;color:var(--text-muted)">← Courses</a>
            <h1 id="course-name" style="margin-top:6px">Course Performance</h1>
            <p id="course-token" style="margin-top:4px;color:var(--text-muted);font-size:12px">CRS-2026-001</p>
          </div>
          <a id="edit-course-btn" href="course-form.html" class="btn-primary">Edit Course</a>
        </div>
        <!-- METRICS GRID: KPI cards -->
        <div class="page-grid">
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#EFF6FF;--icon-bg-end:#DBEAFE">
            <div class="metric-top">
              <div class="metric-content">
                <span>Total Learners</span>
                <strong id="cp-total">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #EFF6FF, #DBEAFE)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" class="anim-float"
                  style="width:24px;height:24px">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                  <circle cx="9" cy="7" r="4" />
                  <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                  <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Enrolled learners</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#F0FDF4;--icon-bg-end:#DCFCE7">
            <div class="metric-top">
              <div class="metric-content">
                <span>Avg Progress</span>
                <strong id="cp-progress">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #F0FDF4, #DCFCE7)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" class="anim-pulse"
                  style="width:24px;height:24px">
                  <line x1="18" y1="20" x2="18" y2="10" />
                  <line x1="12" y1="20" x2="12" y2="4" />
                  <line x1="6" y1="20" x2="6" y2="14" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Completion rate</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#FFFBEB;--icon-bg-end:#FEF3C7">
            <div class="metric-top">
              <div class="metric-content">
                <span>Assignments</span>
                <strong id="cp-assignments">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #FFFBEB, #FEF3C7)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" class="anim-float-slow"
                  style="width:24px;height:24px">
                  <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                  <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Total tasks</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#F5F3FF;--icon-bg-end:#DDD6FE">
            <div class="metric-top">
              <div class="metric-content">
                <span>Quizzes</span>
                <strong id="cp-quizzes">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #F5F3FF, #DDD6FE)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" class="anim-bounce-subtle"
                  style="width:24px;height:24px">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Total assessments</div>
          </div>
        </div>
        <!-- CARD: Main content card -->
        <div class="card card-pad-lg">
          <div class="card-head">
            <div class="card-title">Learner Progress</div>
          </div>
          <div id="learner-progress" class="data-list" style="margin-top:16px"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <!-- CARD: Main content card -->
          <div class="card card-pad-lg">
            <div class="card-head">
              <div class="card-title">Assignments</div><a id="create-asg" href="assignment-form.html"
                class="btn-light">+ New</a>
            </div>
            <div id="assignments-list" class="data-list" style="margin-top:16px"></div>
          </div>
          <!-- CARD: Main content card -->
          <div class="card card-pad-lg">
            <div class="card-head">
              <div class="card-title">Quizzes</div><a href="quiz-form.html" class="btn-light">+ New Quiz</a>
            </div>
            <div id="quizzes-list" class="data-list" style="margin-top:16px"></div>
          </div>
        </div>
        <!-- CARD: Main content card -->
        <div class="card card-pad-lg">
          <div class="card-head">
            <div class="card-title">Top Students</div>
          </div>
          <div id="top-students" class="data-list" style="margin-top:16px"></div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/course-performance.js"></script>

</body>

</html>
