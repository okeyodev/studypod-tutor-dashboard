<!-- ==========================================================================
     EMAIL-MESSAGE.HTML - StudyPod v2.1
     Purpose: Email Message page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email Message | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/email.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <div class="email-head">
          <div><a href="email.html" style="font-size:12px;color:var(--text-muted)">← Back to Inbox</a>
            <h1 id="email-subject" style="margin-top:6px;font-size:22px">Email Message</h1>
          </div>
          <div style="display:flex;gap:8px"><button class="btn-light"
              onclick="window.replyEmail && window.replyEmail()">Reply</button><button class="btn-light"
              onclick="location.href='email.html'">Close</button></div>
        </div>
        <div class="email-main" id="email-message" style="max-width:800px">
          <div class="email-message-content">
            <div class="email-meta" id="email-meta"></div>
            <div class="email-body" id="email-body"></div>
          </div>
          <div class="email-message-actions">
            <button class="btn-light" onclick="window.toggleStar && window.toggleStar()"><span
                class="animated-icon anim-pulse" style="width:16px;height:16px"><svg viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></span> Star</button>
            <button class="btn-light" onclick="window.toggleRead && window.toggleRead()">Mark Unread</button>
            <button class="btn-light" style="color:var(--color-danger)"
              onclick="window.deleteEmail && window.deleteEmail()">Delete</button>
            <button class="btn-primary" onclick="window.replyEmail && window.replyEmail()">Reply</button>
          </div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/email.js"></script>

</body>

</html>
