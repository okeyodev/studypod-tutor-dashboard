<!-- ==========================================================================
     EMAIL-SENT.HTML - StudyPod v2.1
     Purpose: Email Sent page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sent | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/email.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <div class="email-head">
          <div>
            <h1>Email - Sent</h1>
            <p>Sent messages</p>
          </div>
          <a href="email-compose.html" class="btn-primary">+ Compose</a>
        </div>
        <div class="email-layout">
          <div class="email-sidebar">
            <h2>Folders</h2>
            <button class="email-nav" data-folder="inbox" onclick="location.href='email.html?folder=inbox'"><span><span
                  class="animated-icon" style="width:16px;height:16px"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                    <path
                      d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" />
                  </svg></span> Inbox</span><span class="email-count" id="count-inbox">0</span></button>
            <button class="email-nav active" data-folder="sent" onclick="location.href='email-sent.html'"><span><span
                  class="animated-icon" style="width:16px;height:16px"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13" />
                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                  </svg></span> Sent</span><span class="email-count" id="count-sent">0</span></button>
            <button class="email-nav" data-folder="drafts" onclick="location.href='email-drafts.html'"><span><span
                  class="animated-icon" style="width:18px;height:18px"><svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                  </svg></span> Drafts</span><span class="email-count" id="count-drafts">0</span></button>
            <button class="email-nav" data-folder="trash" onclick="location.href='email.html?folder=trash'"><span><svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
                  <polyline points="3 6 5 6 21 6" />
                  <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                </svg> Trash</span><span class="email-count" id="count-trash">0</span></button>
          </div>
          <div class="email-main">
            <div class="email-toolbar">
              <div>
                <div class="email-title">Sent</div>
                <div class="email-subtitle" id="folder-subtitle">0 messages</div>
              </div><input id="email-search" class="email-search" placeholder="Search sent...">
            </div>

            <!-- ==========================================================================
       REUSABLE TEMPLATE: Email Item - Moved from email.js for PHP deployment
       PHP-ready: clone via JS or render via PHP loop
       Logic preserved: avatar color, initials, sender, date, subject, preview,
       unread, starred, read/unread, trash, click actions, reusable
       ========================================================================== -->
            <template id="email-item-template">
              <div class="email-item" data-id="">
                <div class="email-avatar"></div>
                <div class="email-item-body">
                  <div class="email-item-top">
                    <div class="email-sender"></div>
                    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
                      <span class="email-date"></span>
                      <span class="email-star" style="font-size:16px;cursor:pointer;user-select:none"></span>
                    </div>
                  </div>
                  <div class="email-subject"></div>
                  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:4px">
                    <div class="email-preview" style="flex:1;min-width:0"></div>
                    <div style="display:flex;gap:6px;flex-shrink:0" class="email-actions"
                      onclick="event.stopPropagation()">
                      <button class="email-button email-read-btn"
                        style="padding:5px 8px;font-size:11px;line-height:1"></button>
                      <button class="email-button email-delete-btn"
                        style="padding:5px 8px;font-size:11px;line-height:1"><svg viewBox="0 0 24 24" fill="none"
                          stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
                          <polyline points="3 6 5 6 21 6" />
                          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg></button>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <div id="email-list" class="email-list"></div>
          </div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/email.js"></script>

</body>

</html>
