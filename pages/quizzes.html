<!-- ==========================================================================
     QUIZZES.HTML - StudyPod v2.1
     Purpose: Quizzes page with CRUD functionality
     Features: Animated SVG icons, image upload, responsive, dark mode
     Dependencies: variables.css, common.css, animated-icons.css
     ========================================================================== -->
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quizzes | studyPod</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/animated-icons.css">
  <link rel="stylesheet" href="../css/quizzes.css">
  <link rel="icon" href="../assets/logo.png">

  <script>try { const t = localStorage.getItem('studypod_theme'); const d = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches); if (d) { document.documentElement.classList.add('dark'); } } catch (e) { }</script>
</head>

<body>
  <div class="app"><!-- SIDEBAR: Rendered dynamically by common.js - collapsible, sticky, logo -->
    <div id="layout-sidebar"></div>
    <!-- MAIN: Primary content area, margin-left for fixed sidebar -->
    <main class="main"><!-- HEADER: Rendered dynamically - logo left, theme toggle + notif + profile right -->
      <div id="layout-header"></div>
      <!-- CONTENT SECTION: Page main content -->
      <section class="content page-shell">

        <!-- PAGE HEADER: Title, description and primary actions -->
        <div class="page-head">
          <div>
            <h1>Quizzes</h1>
            <p>Create and manage assessments for your courses.</p>
          </div>
          <a href="quiz-form.html" class="btn-primary">+ Create Quiz</a>
        </div>
        <!-- METRICS GRID: KPI cards -->
        <div class="page-grid">
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#EFF6FF;--icon-bg-end:#DBEAFE">
            <div class="metric-top">
              <div class="metric-content">
                <span>Total Quizzes</span>
                <strong id="total-quizzes">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #EFF6FF, #DBEAFE)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" class="anim-float-slow"
                  style="width:24px;height:24px">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">All quizzes</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#F0FDF4;--icon-bg-end:#DCFCE7">
            <div class="metric-top">
              <div class="metric-content">
                <span>Published</span>
                <strong id="published-quizzes">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #F0FDF4, #DCFCE7)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" class="anim-pulse"
                  style="width:24px;height:24px">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                  <polyline points="22 4 12 14.01 9 11.01" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Live quizzes</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#FFFBEB;--icon-bg-end:#FEF3C7">
            <div class="metric-top">
              <div class="metric-content">
                <span>Drafts</span>
                <strong id="draft-quizzes">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #FFFBEB, #FEF3C7)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2" class="anim-float"
                  style="width:24px;height:24px">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">In preparation</div>
          </div>
          <div class="metric-card metric-card-animated" style="--icon-bg-start:#F5F3FF;--icon-bg-end:#DDD6FE">
            <div class="metric-top">
              <div class="metric-content">
                <span>Avg Score</span>
                <strong id="avg-score">0</strong>
              </div>
              <div class="metric-icon" style="background:linear-gradient(135deg, #F5F3FF, #DDD6FE)"><svg
                  viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2" class="anim-pulse"
                  style="width:24px;height:24px">
                  <polygon
                    points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                </svg></div>
            </div>
            <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Average performance</div>
          </div>
        </div>
        <!-- CARD: Main content card -->
        <div class="card card-pad-lg">
          <!-- TOOLBAR: Search, filters and actions -->
          <div class="toolbar">
            <input id="quiz-search" class="search-input" placeholder="Search quizzes...">
            <div style="display:flex;gap:8px"><select id="filter-course" class="select-input">
                <option value="all">All Courses</option>
              </select><select id="filter-status" class="select-input">
                <option value="all">All Status</option>
                <option value="published">Published</option>
                <option value="draft">Draft</option>
              </select></div>
          </div>

          <!-- ==========================================================================
       REUSABLE TEMPLATE: Quiz Card Top - Moved from quizzes.js for PHP deployment
       This is course-card-top reused for quizzes. PHP-ready, logic preserved:
       token, status, title, course, Q count, time, pass %, stats, actions
       ========================================================================== -->
          <template id="quiz-card-template">
            <div class="quiz-card course-card" data-quiz-id="">
              <div class="course-card-top" style="padding:0;">
                <div
                  style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px;">
                  <span class="quiz-token course-card-token"
                    style="font-size:10px; font-weight:700; letter-spacing:0.08em; color:var(--text-muted); text-transform:uppercase;"></span>
                  <span class="course-status quiz-status"
                    style="font-size:11px; padding:4px 8px; border-radius:999px; font-weight:600;"></span>
                </div>
                <h3 class="quiz-title course-card-title"
                  style="font-size:16px; font-weight:700; line-height:1.3; margin:8px 0;"></h3>
                <span class="assignment-course quiz-course"
                  style="font-size:12px; color:var(--color-primary, #4F46E5); background:var(--color-primary-light, #EEF2FF); padding:4px 8px; border-radius:999px; display:inline-flex; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
                <div class="quiz-meta course-card-meta"
                  style="display:flex; gap:12px; font-size:11px; color:var(--text-secondary); margin-top:12px; flex-wrap:wrap;">
                  <span class="quiz-qcount"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      style="width:14px;height:14px">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg> <span class="qcount-text"></span></span>
                  <span class="quiz-timelimit"></span>
                  <span class="quiz-pass"></span>
                </div>
                <div class="quiz-stats"
                  style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px;">
                  <div class="quiz-stat"
                    style="text-align:center; padding:10px; background:var(--bg-page, #F8FAFC); border-radius:8px;">
                    <strong class="quiz-attempts-count" style="display:block; font-size:16px;"></strong>
                    <span
                      style="font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Attempts</span>
                  </div>
                  <div class="quiz-stat"
                    style="text-align:center; padding:10px; background:var(--bg-page, #F8FAFC); border-radius:8px;">
                    <strong class="quiz-avg-score" style="display:block; font-size:16px;"></strong>
                    <span
                      style="font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Avg
                      Score</span>
                  </div>
                  <div class="quiz-stat"
                    style="text-align:center; padding:10px; background:var(--bg-page, #F8FAFC); border-radius:8px;">
                    <strong class="quiz-questions-count" style="display:block; font-size:16px;"></strong>
                    <span
                      style="font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em;">Questions</span>
                  </div>
                </div>
              </div>
              <div class="course-card-foot quiz-foot"
                style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border-light, #E2E8F0); display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;">
                <div class="quiz-actions" style="display:flex; gap:6px; flex-wrap:wrap; flex:1;">
                  <a class="btn-secondary quiz-performance-link"
                    style="font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--border-light); background:var(--bg-card); text-decoration:none; color:var(--text-primary); cursor:pointer; display:inline-flex; align-items:center; gap:4px;"><svg
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      style="width:16px;height:16px">
                      <line x1="18" y1="20" x2="18" y2="10" />
                      <line x1="12" y1="20" x2="12" y2="4" />
                      <line x1="6" y1="20" x2="6" y2="14" />
                    </svg> Performance</a>
                  <a class="btn-secondary quiz-edit-link"
                    style="font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid var(--border-light); background:var(--bg-card); text-decoration:none; color:var(--text-primary); cursor:pointer;"><svg
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      style="width:14px;height:14px">
                      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                    </svg> Edit</a>
                </div>
                <div class="quiz-actions-secondary" style="display:flex; gap:6px; align-items:center;">
                  <button data-action="duplicate" class="btn-icon quiz-duplicate-btn"
                    style="width:28px; height:28px; border-radius:6px; border:1px solid var(--border-light); background:var(--bg-card); display:grid; place-items:center; cursor:pointer;">⧉</button>
                  <button data-action="toggle-publish" class="btn-icon quiz-publish-btn"
                    style="width:28px; height:28px; border-radius:6px; border:1px solid var(--border-light); background:var(--bg-card); display:grid; place-items:center; cursor:pointer;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px">
                      <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" />
                      <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" />
                    </svg></button>
                  <button data-action="delete" class="btn-icon danger quiz-delete-btn"
                    style="width:28px; height:28px; border-radius:6px; border:1px solid #FECACA; background:#FEF2F2; color:#DC2626; display:grid; place-items:center; cursor:pointer;"><svg
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                      style="width:14px;height:14px">
                      <polyline points="3 6 5 6 21 6" />
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg></button>
                </div>
              </div>
            </div>
          </template>

          <div id="quiz-grid" class="quiz-grid" style="margin-top:16px"></div>
          <div id="empty-quizzes" class="empty-state" style="display:none;margin-top:16px">
            <div class="empty-icon"><span class="animated-icon anim-pulse" style="width:18px;height:18px"><svg
                  viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10" />
                  <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg></span></div>
            <div class="empty-title">No quizzes yet</div>
            <div class="empty-sub">Create your first quiz</div><a href="quiz-form.html" class="btn-primary"
              style="margin-top:12px">Create Quiz</a>
          </div>
        </div>

      </section>
      <!-- MOBILE NAV: Bottom navigation for mobile -->
      <div id="layout-mobile-nav"></div><!-- OVERLAYS: Drawers, modals, toasts -->
      <div id="layout-overlays"></div>
    </main>
  </div>
  <script src="../js/store.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/quizzes.js"></script>

</body>

</html>
